<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan du stock</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --line: #262626;
    --shelf: #ffffff;
    --shelf-stroke: #4b5563;
    --hl: #16b378;          /* vert Grist */
    --hl-soft: rgba(22, 179, 120, 0.22);
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e24;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #d1d5db;
      --shelf: #2a2a32;
      --shelf-stroke: #9ca3af;
      --hl-soft: rgba(22, 179, 120, 0.35);
      --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px; border-bottom: 1px solid rgba(127,127,127,.25); min-height: 44px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #nom { font-weight: 600; font-size: 14px; }
  #loc { font-size: 13px; color: var(--muted); }
  #loc.ok { color: var(--hl); font-weight: 600; }
  #loc.warn { color: var(--warn); }
  main { flex: 1; min-height: 0; padding: 8px; }
  svg { width: 100%; height: 100%; display: block; }
  .contour { fill: none; stroke: var(--line); stroke-width: 4; stroke-linejoin: round; }
  .shelf rect { fill: var(--shelf); stroke: var(--shelf-stroke); stroke-width: 2.7;
    transition: fill .2s, stroke .2s, stroke-width .2s; }
  .shelf text { fill: var(--text); font-size: 26px; text-anchor: middle; dominant-baseline: central;
    pointer-events: none; transition: font-weight .2s; }
  .shelf.on rect { fill: var(--hl-soft); stroke: var(--hl); stroke-width: 6; }
  .shelf.on text { font-weight: 700; fill: var(--hl); }
  .shelf text.sous { font-size: 17px; font-weight: 700; }
  .zone rect { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 10 7;
    transition: fill .2s, stroke .2s; }
  .zone text { fill: var(--muted); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .zone.on rect { fill: var(--hl-soft); stroke: var(--hl); stroke-width: 4; stroke-dasharray: none; }
  .zone.on text { fill: var(--hl); font-weight: 700; }
  .shelf.on .pulse, .zone.on .pulse { fill: none; stroke: var(--hl); stroke-width: 4; stroke-dasharray: none;
    animation: pulse 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse { display: none; }
  .shelf.on .pulse, .zone.on .pulse { display: block; }
  .zone.on .pulse { animation-name: pulse-zone; }
  @keyframes pulse {
    0%   { opacity: .9; transform: scale(1); }
    100% { opacity: 0;  transform: scale(1.12); }
  }
  @keyframes pulse-zone {
    0%   { opacity: .9; transform: scale(1); }
    100% { opacity: 0;  transform: scale(1.03); }
  }
  @media (prefers-reduced-motion: reduce) { .shelf.on .pulse, .zone.on .pulse { animation: none; opacity: .5; } }
</style>
</head>
<body>
<header>
  <span id="nom">Plan du stock</span>
  <span id="loc">Sélectionnez un matériel ou un consommable.</span>
</header>
<main>
  <svg id="plan" viewBox="0 70 1140 660" role="img" aria-label="Plan du stock"></svg>
</main>

<script>
// Étagères du plan (coordonnées reprises de « Plan du stock.svg »)
const ETAGERES = [
  // Rangée du bas : espaces laissés entre H et G, entre G et F, et entre A et le mur d'entrée
  ["A", 907, 640.85, 95, 65.32], ["B", 812, 640.85, 95, 65.32],
  ["C", 717, 640.85, 95, 65.32], ["D", 622, 640.85, 95, 65.32],
  ["E", 527, 640.85, 95, 65.32], ["F", 432, 640.85, 95, 65.32],
  ["G", 287, 640.85, 95, 65.32], ["H", 137, 640.85, 95, 65.32],
  ["I",  42, 640.85, 95, 65.32],
  ["J",  42.93, 303.72, 65.32, 103.11], ["K",  42.93, 199.78, 65.32, 103.11],
  ["L",  42.93,  95.85, 65.32, 103.11],
  ["M", 258.37,  95.85, 103.11, 65.32], ["N", 362.30,  95.85, 103.11, 65.32],
  ["O", 466.24, 303.72, 65.32, 103.11], ["P", 466.24, 199.78, 65.32, 103.11],
  ["Q", 466.24,  95.85, 65.32, 103.11],
  ["R", 674.11, 303.72, 65.32, 103.11], ["S", 674.11, 199.78, 65.32, 103.11],
  ["T", 674.11,  95.85, 65.32, 103.11],
  ["U", 851.75, 303.72, 65.32, 103.11], ["V", 851.75, 199.78, 65.32, 103.11],
  ["W", 851.75,  95.85, 65.32, 103.11],
  ["X", 1012.38, 303.72, 65.32, 103.11], ["Y", 1012.38, 199.78, 65.32, 103.11],
  ["Z", 1012.38,  95.85, 65.32, 103.11],
];
// Zones au sol (matériel trop grand pour les étagères) : [code dans Grist, libellé sur le plan, x, y, largeur, hauteur, taille du texte]
const ZONES = [
  ["Allée 1",        "Allée 1",        114, 167, 346, 234, 24],
  ["Allée 2",        "Allée 2",        538, 102, 130, 299, 22],
  ["Allée 3",        "Allée 3",        746, 102,  99, 299, 20],
  ["Allée 4",        "Allée 4",        924, 102,  82, 299, 17],
  ["Allée centrale", "Allée centrale",  48, 413, 1023, 221, 26],
  ["Entrée",         "Entrée",        1008, 647,  63,  53, 15],
  ["Entre F et G",   "F-G",            388, 647,  38,  53, 14],
  ["Entre G et H",   "G-H",            238, 647,  43,  53, 14],
];
// Mur avec la porte d'entrée à droite (ouverture + battant)
const CONTOUR = "m 1118.33,439.32 -41.17,168.62 v 98.83 H 41.57 V 94.49 H 1077.17 V 438.46";

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plan");
const elNom = document.getElementById("nom");
const elLoc = document.getElementById("loc");

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Dessin du plan : zones au sol d'abord (en dessous), puis le mur et les étagères
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
const zones = {};
for (const [code, libelle, x, y, w, h, taille] of ZONES) {
  const g = el("g", { class: "zone", "data-loc": code }, svg);
  el("rect", { x, y, width: w, height: h, rx: 6 }, g);
  el("rect", { x, y, width: w, height: h, rx: 6, class: "pulse" }, g);
  const t = el("text", { x: x + w / 2, y: y + h / 2, "font-size": taille }, g);
  t.textContent = libelle;
  zones[norm(code)] = { code, g };
}
el("path", { d: CONTOUR, class: "contour" }, svg);
const groupes = {}, sousTextes = {};
for (const [id, x, y, w, h] of ETAGERES) {
  const g = el("g", { class: "shelf", "data-loc": id }, svg);
  el("rect", { x, y, width: w, height: h }, g);
  el("rect", { x, y, width: w, height: h, class: "pulse" }, g);
  const t = el("text", { x: x + w / 2, y: y + h / 2, class: "lettre" }, g);
  t.textContent = id;
  t.dataset.cy = y + h / 2;
  // sous-emplacement(s) affiché(s) sous la lettre quand l'étagère est allumée
  const st = el("text", { x: x + w / 2, y: y + h / 2 + 15, class: "sous" }, g);
  groupes[id] = g;
  sousTextes[id] = st;
}

// Transforme la valeur de la colonne Emplacement en { etageres: { lettre: [sous-emplacements] }, zones: [codes] }
// Accepte « A2 », « A » (étagère entière), un nom de zone (« Allée 2 », « Entrée »…),
// une liste Grist ou un texte séparé par des virgules.
function emplacements(valeur) {
  const res = { etageres: {}, zones: [] };
  if (valeur == null || valeur === "") return res;
  const parties = Array.isArray(valeur) ? valeur : String(valeur).split(/[,;\/]+/);
  for (const partie of parties) {
    const zone = zones[norm(partie)];
    if (zone) {
      if (!res.zones.includes(zone.code)) res.zones.push(zone.code);
      continue;
    }
    for (const v of String(partie).split(/\s+/)) {
      const m = /^([A-Z])-?([0-9]+)?$/.exec(v.trim().toUpperCase());
      if (!m || !groupes[m[1]]) continue;
      res.etageres[m[1]] = res.etageres[m[1]] || [];
      if (m[2] && !res.etageres[m[1]].includes(m[2])) res.etageres[m[1]].push(m[2]);
    }
  }
  for (const k in res.etageres) res.etageres[k].sort();
  return res;
}

function afficher(nom, valeur) {
  const tout = emplacements(valeur);
  const locs = tout.etageres;
  const ids = Object.keys(locs).sort();
  for (const z of Object.values(zones)) z.g.classList.toggle("on", tout.zones.includes(z.code));
  for (const id in groupes) {
    const on = id in locs;
    groupes[id].classList.toggle("on", on);
    const sous = on && locs[id].length ? locs[id].join(" · ") : "";
    sousTextes[id].textContent = sous;
    // remonte un peu la lettre pour laisser la place au sous-emplacement
    const lettre = groupes[id].querySelector("text.lettre");
    lettre.setAttribute("y", Number(lettre.dataset.cy) - (sous ? 9 : 0));
  }
  elNom.textContent = nom || "Plan du stock";
  if (ids.length || tout.zones.length) {
    const codes = ids.flatMap(id => locs[id].length ? locs[id].map(n => id + n) : [id]).concat(tout.zones);
    elLoc.className = "ok";
    elLoc.textContent = (codes.length > 1 ? "→ Emplacements " : "→ Emplacement ") + codes.join(", ");
  } else if (nom) {
    elLoc.className = "warn";
    elLoc.textContent = "Emplacement non renseigné";
  } else {
    elLoc.className = "";
    elLoc.textContent = "Sélectionnez un matériel ou un consommable.";
  }
}

function demarrer() {
  if (!window.grist) {
    elLoc.className = "warn";
    elLoc.textContent = "API Grist introuvable : ouvrez ce plan depuis un widget personnalisé Grist.";
    return;
  }
  grist.ready({
    requiredAccess: "read table",
    columns: [
      { name: "Emplacement", title: "Emplacement (ex. A2)", type: "Any" },
      { name: "Nom", title: "Nom affiché", type: "Any", optional: true },
    ],
  });
  grist.onRecord(record => {
    if (!record) { afficher("", null); return; }
    // Colonnes associées dans le panneau du widget, sinon noms par défaut du document
    const m = grist.mapColumnNames(record) || {
      Emplacement: record.Emplacement,
      Nom: record.Libelle != null ? record.Libelle : record.Designation,
    };
    if (m.Emplacement === undefined) {
      elLoc.className = "warn";
      elLoc.textContent = "Choisissez la colonne « Emplacement » dans les options du widget.";
      return;
    }
    afficher(m.Nom != null ? String(m.Nom) : "Ligne " + record.id, m.Emplacement);
  });
  grist.onRecords(() => {}); // garde le widget à jour quand les données changent
}

// Charge l'API Grist (aucun accès au réseau local depuis cette page)
(function chargerApi() {
  const s = document.createElement("script");
  s.src = "https://docs.getgrist.com/grist-plugin-api.js";
  s.onload = demarrer;
  s.onerror = demarrer;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
